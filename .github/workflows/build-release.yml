name: Build and release

on:
  pull_request:
    branches:
      - release
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: windows-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install pyautogui pygetwindow pillow pyinstaller

      - name: Check Python syntax
        run: python -m py_compile wow_char_auto.py

      - name: Build executable
        run: pyinstaller --onefile --windowed --name WoWCharAuto wow_char_auto.py

      - name: Smoke-test executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "$env:GITHUB_WORKSPACE\dist\WoWCharAuto.exe" -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            throw "WoWCharAuto.exe exited during the smoke test."
          }
          Stop-Process -Id $process.Id -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: WoWCharAuto-windows
          path: dist/WoWCharAuto.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: WoWCharAuto-windows
          path: release

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create $tag release/WoWCharAuto.exe `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "WoWCharAuto build ${{ github.run_number }}" `
            --notes "Автоматическая сборка ветки release. Коммит: ${{ github.sha }}"
